{{- $parent := .Values.projectAnchor.nestedChart.links.parent -}}
{{- $orphanLabel := printf "dognauts.io/parent=%s" $parent -}}
{{- $resourceKindMap := dict "kmcp" "mcpserver" "kagent" "agent" -}}
{{- $resourceKind := index $resourceKindMap $parent -}}
{{- if not $resourceKind -}}
{{- fail (printf "orphan-cleanup hook: unknown parent %q — no CR kind mapping defined; add it to $resourceKindMap in this template" $parent) -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-orphan-nested-cleanup
  labels:
    {{- include "dognauts-common-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: orphan-nested-cleanup
    spec:
      serviceAccountName: {{ .Release.Name }}-orphan-nested-cleanup
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: "{{ .Values.projectAnchor.hooks.kubectlImage.registry }}/alpine-kubectl:1.33.10-u0"
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - |
              trap 'curl -sf -X POST http://localhost:15000/quitquitquit >/dev/null 2>&1 || true' EXIT
              set -e
              NAMESPACE={{ .Release.Namespace }}
              LABEL="{{ $orphanLabel }}"
              KIND="{{ $resourceKind }}"

              RELEASES=$(kubectl get "$KIND" -n "$NAMESPACE" -l "$LABEL" \
                -o jsonpath='{range .items[*]}{.metadata.annotations.meta\.helm\.sh/release-name}{"\n"}{end}' \
                | sort -u)

              if [ -z "$RELEASES" ]; then
                echo "No orphaned child releases found for this parent release"
                exit 0
              fi

              echo "Found orphaned child releases to clean up: $RELEASES"

              for release in $RELEASES; do
                echo "Uninstalling release: $release"
                helm uninstall "$release" -n "$NAMESPACE" --wait=false || echo "Failed to uninstall $release, continuing..."
              done
      restartPolicy: Never
  backoffLimit: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-orphan-nested-cleanup
  labels:
    {{- include "dognauts-common-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-12"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-orphan-nested-cleanup
  labels:
    {{- include "dognauts-common-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-12"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["kagent.dev"]
    resources: ["mcpservers", "agents"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts", "secrets", "configmaps"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-orphan-nested-cleanup
  labels:
    {{- include "dognauts-common-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-12"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-orphan-nested-cleanup
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-orphan-nested-cleanup
    namespace: {{ .Release.Namespace }}
#[@< if eq (getenv "NETPOLICY_TYPE" "none") "cilium" >@]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Release.Name }}-orphan-nested-cleanup
  labels:
    {{- include "dognauts-common-chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-13"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      app: orphan-nested-cleanup
  egress:
    - toEntities:
        - kube-apiserver
#[@< end >@]