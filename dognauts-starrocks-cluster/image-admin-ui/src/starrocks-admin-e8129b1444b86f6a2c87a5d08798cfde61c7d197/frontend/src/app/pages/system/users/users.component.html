<nb-card>
  <nb-card-header>
    <div class="header">
      <div class="header__info">
        <h5 class="header__title">User Management</h5>
        <p class="header__subtitle">Manage system users and their role permissions in one place.</p>
      </div>
      <button
        nbButton
        status="primary"
        size="small"
        (click)="openCreateUser()"
        [disabled]="!canCreateUser"
        ngxHasPermission="api:users:create"
      >
        <nb-icon icon="person-add-outline"></nb-icon>
        Add User
      </button>
    </div>
  </nb-card-header>
  <nb-card-body>
    <div *ngIf="loading" class="loading">
      <nb-spinner size="large" status="primary"></nb-spinner>
    </div>

    <nb-alert *ngIf="!loading && !hasListPermission" status="warning">
      You do not have permission to view users. Contact your administrator to request access.
    </nb-alert>

    <ng2-smart-table
      *ngIf="!loading && hasListPermission"
      [settings]="settings"
      [source]="source"
    >
    </ng2-smart-table>
  </nb-card-body>
</nb-card>
