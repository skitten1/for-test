<nb-card>
  <nb-card-header>
    <h5>{{ isEditMode ? 'Edit Cluster' : 'Add Cluster' }}</h5>
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="clusterForm" (ngSubmit)="onSubmit()">
      <!-- 基本信息 -->
      <div class="row">
        <!-- 所属组织 (Super Admin Only) -->
        <div class="col-md-4" *ngIf="isSuperAdmin">
          <div class="form-group">
            <label for="organization" class="label">Organization *</label>
            <nb-select
              formControlName="organization_id"
              id="organization"
              placeholder="Select an organization."
              [status]="clusterForm.get('organization_id')?.invalid && clusterForm.get('organization_id')?.touched ? 'danger' : 'basic'"
              fullWidth
            >
              <nb-option *ngFor="let org of organizations" [value]="org.id">
                {{ org.name }}
                <span class="text-hint" *ngIf="org.code"> ({{ org.code }})</span>
              </nb-option>
            </nb-select>
            <small class="form-text text-danger" *ngIf="clusterForm.get('organization_id')?.invalid && clusterForm.get('organization_id')?.touched">
              Select an organization.
            </small>
          </div>
        </div>

        <!-- 所属组织显示 (Org Admin) -->
        <div class="col-md-4" *ngIf="!isSuperAdmin && currentOrganization">
          <div class="form-group">
            <label class="label">Organization</label>
            <input nbInput fullWidth [value]="currentOrganization.name + ' (' + currentOrganization.code + ')'" disabled />
          </div>
        </div>

        <div class="col-md-4">
          <div class="form-group">
            <label for="name" class="label">Cluster Name *</label>
            <input
              nbInput
              fullWidth
              type="text"
              id="name"
              formControlName="name"
              placeholder="Enter a cluster name"
              [status]="clusterForm.get('name')?.invalid && clusterForm.get('name')?.touched ? 'danger' : 'basic'"
            />
            <small class="form-text text-danger" *ngIf="clusterForm.get('name')?.invalid && clusterForm.get('name')?.touched">
              pleaseEnter a cluster name
            </small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="form-group">
            <label for="deployment_mode" class="label">Deployment Mode *</label>
            <nb-select
              formControlName="deployment_mode"
              id="deployment_mode"
              placeholder="Select a deployment mode"
              [status]="clusterForm.get('deployment_mode')?.invalid && clusterForm.get('deployment_mode')?.touched ? 'danger' : 'basic'"
              fullWidth
            >
              <nb-option value="shared_nothing">Shared-Nothing (Shared-Nothing)</nb-option>
              <nb-option value="shared_data">Shared-Data (Shared-Data)</nb-option>
            </nb-select>
            <small class="form-text text-danger" *ngIf="clusterForm.get('deployment_mode')?.invalid && clusterForm.get('deployment_mode')?.touched">
              Select a deployment mode
            </small>
          </div>
        </div>
      </div>

      <!-- 连接信息 -->
      <h6>connection details</h6>
      <hr />
      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label for="fe_host" class="label">FE Address *</label>
            <input
              nbInput
              fullWidth
              type="text"
              id="fe_host"
              formControlName="fe_host"
              placeholder="192.168.1.100"
              [status]="clusterForm.get('fe_host')?.invalid && clusterForm.get('fe_host')?.touched ? 'danger' : 'basic'"
            />
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="fe_http_port" class="label">HTTP Port *</label>
            <input
              nbInput
              fullWidth
              type="number"
              id="fe_http_port"
              formControlName="fe_http_port"
              placeholder="8030"
            />
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="fe_query_port" class="label">Query Port *</label>
            <input
              nbInput
              fullWidth
              type="number"
              id="fe_query_port"
              formControlName="fe_query_port"
              placeholder="9030"
            />
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="username" class="label">Username *</label>
            <input
              nbInput
              fullWidth
              type="text"
              id="username"
              formControlName="username"
              placeholder="root"
              [status]="clusterForm.get('username')?.invalid && clusterForm.get('username')?.touched ? 'danger' : 'basic'"
            />
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="password" class="label">password {{ isEditMode ? '(Leave blank to keep unchanged)' : '*' }}</label>
            <input
              nbInput
              fullWidth
              type="password"
              id="password"
              formControlName="password"
              placeholder="Enter a password"
              [status]="clusterForm.get('password')?.invalid && clusterForm.get('password')?.touched ? 'danger' : 'basic'"
            />
          </div>
        </div>
      </div>

      <!-- 高级选项 -->
      <h6>Advanced Options</h6>
      <hr />
      <div class="row">
        <div class="col-md-3">
          <div class="form-group">
            <label for="catalog" class="label">Catalog</label>
            <input
              nbInput
              fullWidth
              type="text"
              id="catalog"
              formControlName="catalog"
              placeholder="default_catalog"
            />
          </div>
        </div>

        <div class="col-md-2">
          <div class="form-group">
            <label for="connection_timeout" class="label">Connection Timeout (sec)</label>
            <input
              nbInput
              fullWidth
              type="number"
              id="connection_timeout"
              formControlName="connection_timeout"
              placeholder="10"
            />
          </div>
        </div>

        <div class="col-md-3">
          <div class="form-group">
            <label for="tags" class="label">Tags (comma-separated)</label>
            <input
              nbInput
              fullWidth
              type="text"
              id="tags"
              formControlName="tags"
              placeholder="Production, Beijing, Primary Cluster"
            />
          </div>
        </div>

        <div class="col-md-2 d-flex align-items-end">
          <div class="form-group">
            <nb-checkbox formControlName="enable_ssl">Enable SSL</nb-checkbox>
          </div>
        </div>
      </div>

      <!-- 描述 -->
      <div class="row">
        <div class="col-md-12">
          <div class="form-group">
            <label for="description" class="label">Description</label>
            <textarea
              nbInput
              fullWidth
              id="description"
              formControlName="description"
              placeholder="Enter a cluster description (optional)"
              rows="2"
            ></textarea>
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div class="d-flex justify-content-between align-items-center pt-3" style="border-top: 1px solid #edf1f7;">
        <button
          nbButton
          outline
          size="medium"
          status="info"
          type="button"
          (click)="testConnection()"
          [disabled]="loading"
        >
          <nb-icon icon="refresh-outline"></nb-icon>
          Test Connection
        </button>

        <div class="d-flex gap-3">
          <button
            nbButton
            outline
            size="medium"
            status="basic"
            type="button"
            (click)="onCancel()"
            [disabled]="loading"
          >
            Cancel
          </button>

          <button
            nbButton
            outline
            size="medium"
            status="primary"
            type="submit"
            [disabled]="loading"
          >
            <nb-icon icon="save-outline" *ngIf="!loading"></nb-icon>
            <nb-icon icon="loader-outline" class="spin" *ngIf="loading"></nb-icon>
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
        </div>
      </div>
    </form>
  </nb-card-body>
</nb-card>
