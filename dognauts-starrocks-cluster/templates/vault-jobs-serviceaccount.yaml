{{- /*
ServiceAccount для джоб, которые ходят в Vault: vault-ensure, vault-delete, init, admin-ui-init.
Имя <релиз>-vault-jobs подходит под шаблон *-vault-jobs в роли Kubernetes-авторизации Vault.
Хук (как SA джоб LiteLLM): должен существовать до pre-install джобы vault-ensure и при pre-delete.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dognauts-starrocks.vaultJobsServiceAccount" . }}
  labels:
    {{- include "dognauts-starrocks.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: true
