{{- /*
ext_authz платформы (Keycloak + authz-service + Casbin) на входящем трафике прокси консоли
и Admin UI — двух точек, через которые в StarRocks попадают из шлюза.
*/ -}}
{{- if .Values.envoyFilter.enabled }}
{{- $targets := list (dict "name" "console" "labels" (include "dognauts-starrocks.consoleSelectorLabels" .)) }}
{{- if .Values.adminUi.enabled }}
{{- $targets = append $targets (dict "name" "admin-ui" "labels" (include "dognauts-starrocks.adminUiSelectorLabels" .)) }}
{{- end }}
{{- range $t := $targets }}
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: casbin-starrocks-{{ $t.name }}-{{ $.Release.Name }}
  labels:
    {{- include "dognauts-starrocks.labels" $ | nindent 4 }}
spec:
  workloadSelector:
    labels:
      {{- $t.labels | nindent 6 }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            transport_api_version: V3
            grpc_service:
              envoy_grpc:
                cluster_name: outbound|{{ $.Values.envoyFilter.authServer.port }}||{{ $.Values.envoyFilter.authServer.url }}.{{ $.Values.clusterDomain }}
              timeout: 2s
              initial_metadata:
              {{- range $key, $value := $.Values.envoyFilter.authServer.headers }}
                - key: {{ $key }}
                  value: {{ $value }}
              {{- end }}
            failure_mode_allow: false
            status_on_error:
              code: NetworkAuthenticationRequired
            with_request_body:
              max_request_bytes: 8192
              allow_partial_message: true
{{- end }}
{{- end }}
