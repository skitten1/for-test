{{- /*
ServiceAccount подов, которые получают секреты из Vault (webhook Bank-Vaults логинится в Vault под SA пода).
Имена starrocks-* должны быть разрешены в роли Kubernetes-авторизации Vault (bound_service_account_names),
как у остальных компонентов платформы (*-airflow-*, *-mlflow-*, *-langfuse и т.д.).
Имена фиксированные, как и имя кластера: SA для FE/BE задаётся в values upstream-чарта,
который выводит его без кавычек — плейсхолдер [@< >@] там не работает.
*/ -}}
{{- $cluster := include "dognauts-starrocks.clusterName" . }}
{{- $names := list "fe" "be" }}
{{- if .Values.console.enabled }}{{- $names = append $names "console" }}{{- end }}
{{- if .Values.adminUi.enabled }}{{- $names = append $names "admin-ui" }}{{- end }}
{{- range $n := $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $cluster $n }}
  labels:
    {{- include "dognauts-starrocks.labels" $ | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
