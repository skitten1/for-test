{{- /*
Пункт меню платформы — в том же формате, что и у остальных чартов.
Публикуется через CR ProjectComponent (templates/project-component.yaml).
slug — в старом формате фронтенда "<компонент>-<релиз>" (один сегмент пути).
TODO: при переходе фронта на новые пути — "<релиз>/starrocks" (README nested-релизов).
*/ -}}
{{- define "dognauts-starrocks.projectComponentLinks" }}
starrocks:
  slug: "starrocks-{{ .Release.Name }}"
  parent: starrocks
  type: "component"
  labels:
    en: "{{ .Release.Name }}: FE console"
    ru: "{{ .Release.Name }}: консоль FE"
  link: {{ printf "%s/" (include "dognauts-starrocks.appPrefix" .) | quote }}
  parentIcon: ""
  parentLabels:
    en: "StarRocks"
    ru: "StarRocks"
{{- if .Values.adminUi.enabled }}
starrocks-admin:
  slug: "starrocks-admin-{{ .Release.Name }}"
  parent: starrocks
  type: "component"
  labels:
    en: "{{ .Release.Name }}: Admin UI"
    ru: "{{ .Release.Name }}: Admin UI"
  link: {{ printf "%s/" (include "dognauts-starrocks.adminUiPrefix" .) | quote }}
  parentIcon: ""
  parentLabels:
    en: "StarRocks"
    ru: "StarRocks"
{{- end }}
{{- end }}
